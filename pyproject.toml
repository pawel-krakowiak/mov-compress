[project]
name = "mov-compress"
version = "0.1.0"
description = "Textual TUI that batch-compresses .mov files down to a chosen maximum size using two-pass ffmpeg encoding"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pawel Krakowiak" }]
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "platformdirs>=4.0",
]

[project.scripts]
mov-compress = "mov_compress.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mov_compress"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
